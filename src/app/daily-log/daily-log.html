<div class="daily-log">
  <h2>Daily Task Log - {{ date }}</h2>
  @for (task of tasks(); track task.name; let i = $index) {
    <div class="task">
      <input
        type="checkbox"
        [id]="'task-' + i"
        [ngModel]="task.completed"
        (ngModelChange)="updateTask(i, $event)"
      />
      <label>{{ task.name }}</label>
    </div>
  }
  <button routerLink="/progress-chart">View Progress Chart</button>
</div>
