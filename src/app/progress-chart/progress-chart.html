<div class="progress-chart">
  <h2>75-Day Challenge Progress</h2>
  <div class="start-date-controls">
    <label for="start-date">Challenge Start Date: {{ startDate }}</label>
    <input type="date" id="start-date" [(ngModel)]="startDate" (ngModelChange)="updateStartDate($event)" />
  </div>
  <div class="chart-grid">
    <button *ngFor="let day of days" 
            class="day-box" 
            [ngClass]="{'completed': isDayCompleted(day)}"
            [routerLink]="['/daily-log', getDateForDay(day)]">
      Day {{ day }}
    </button>
  </div>
  <button routerLink="/daily-log">Back to Today’s Daily Log</button>
  <button class="reset-button" (click)="resetProgress()">Reset Challenge</button>
</div>
